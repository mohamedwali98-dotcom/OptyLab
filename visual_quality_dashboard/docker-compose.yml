version: '3.8'

services:
  # ── ML Backend (FastAPI + PyTorch + SVM) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist the training DB and trained model weights outside the container.
      # DB/ lives at the repo root (one level above this compose file), not
      # inside visual_quality_dashboard/ — and the code's model dir is
      # singular ("model"), so both paths below must match exactly or the
      # container trains/serves against an empty, disconnected copy.
      - ../DB:/app/DB
      - ./backend/model:/app/model
    environment:
      - PYTHONUNBUFFERED=1
      - OPTYLAB_DB_DIR=/app/DB
      - OPTYLAB_MODEL_DIR=/app/model
    restart: unless-stopped
    container_name: optylab_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend (Vite build → Nginx) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The frontend calls the backend via the host machine's exposed port
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    restart: unless-stopped
    container_name: optylab_frontend
    depends_on:
      - backend
